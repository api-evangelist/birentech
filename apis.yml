name: Biren Technology
description: >-
  Biren Technology (Shanghai Biren Technology Co., Ltd.) is a Chinese fabless
  semiconductor company that designs general-purpose GPUs (GPGPUs) for AI
  training, inference, and high-performance computing. Its flagship BR100-series
  accelerators are programmed through BIRENSUPA, a CUDA-like software platform
  that bundles the BRCC compiler, a hardware abstraction layer, deep-learning
  and general-compute acceleration libraries, and a developer toolchain with
  support for PyTorch, TensorFlow, and PaddlePaddle. Biren distributes its
  drivers, SDK, and documentation through its developer.birentech.com developer
  community rather than a public web/REST API. Added to the API Evangelist
  network as a portfolio company of Qiming Venture Partners.
